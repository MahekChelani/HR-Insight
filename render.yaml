services:
  - type: web
    name: hr-insight-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hr-insight-db
          property: connectionString
      - key: HR_INSIGHT_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: hr-insight-db
    databaseName: hr_insight
    user: hr_insight
    plan: free
    region: oregon
    postgresMajorVersion: "18"
